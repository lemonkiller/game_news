name: Fetch and Deploy

on:
  schedule:
    - cron: "0 4,20 * * *"
  workflow_dispatch:
  push:
    branches: [master]

# 允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 抓取所有数据源
        run: npm run fetch
        env:
          ZHIHU_ACCESS_SECRET: \${{ secrets.ZHIHU_ACCESS_SECRET }}
      - name: 生成前端注册表
        run: npm run generate-registry
      - name: TypeScript 类型检查
        run: npx tsc --noEmit
      - name: 构建前端
        run: npm run build

      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 防止 GitHub 因仓库 60 天无提交而自动禁用定时抓取
  # 原理：距上次提交超过 45 天时，通过 API 做一次空提交保活（不产生垃圾文件）
  keepalive:
    name: Keepalive
    if: ${{ always() }}
    needs: fetch-and-deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
